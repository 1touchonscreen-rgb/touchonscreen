name: Generate Product Share Pages

on:
  workflow_dispatch:
  push:
    paths:
      - "data/products.json"
      - "tools/generate-share-pages.js"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate share pages
        run: node tools/generate-share-pages.js

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add share sitemap.xml
          git diff --cached --quiet || git commit -m "Generate product share pages"
          git push
